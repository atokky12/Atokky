<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ATOKKY Admin</title>
<style>body{font-family:Arial;background:#f7f2ec;margin:0}.wrap{max-width:850px;margin:30px auto;padding:20px}.brand{font:700 32px Georgia;color:#8a683b}.panel{background:#fff;padding:25px;margin-top:20px;border:1px solid #e5d9cc}input,select{width:100%;padding:12px;margin:7px 0 15px;box-sizing:border-box;border:1px solid #d8cabc}button{background:#8a683b;color:#fff;border:0;padding:12px 18px;cursor:pointer}.danger{background:#a74747}.hidden{display:none}.product{display:flex;justify-content:space-between;border-bottom:1px solid #eee;padding:12px 0}.row{display:grid;grid-template-columns:1fr 1fr;gap:15px}@media(max-width:600px){.row{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="brand">ATOKKY ADMIN</div>
<div id="login" class="panel"><h2>Admin login</h2><p>Use your ATOKKY admin email and private password.</p><input id="email" type="email" placeholder="Admin email"><input id="password" type="password" placeholder="Password"><button onclick="login()">Sign in</button><p id="msg"></p></div>
<div id="dash" class="hidden"><div class="panel"><button style="float:right" onclick="logout()">Sign out</button><h2>Products</h2><div class="row"><div><label>Name</label><input id="name"></div><div><label>Category</label><select id="category"><option>Dresses</option><option>Shoes</option><option>Jewellery</option></select></div></div><div class="row"><div><label>Price (₦)</label><input id="price" type="number"></div><div><label>Photo</label><input id="photo" type="file" accept="image/*"></div></div><button onclick="addProduct()">Add product</button></div><div class="panel"><h2>Your products</h2><div id="list"></div></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>
const {createClient}=supabase;const db=createClient(ATOKKY_SUPABASE_URL,ATOKKY_SUPABASE_ANON_KEY);
async function login(){let {error}=await db.auth.signInWithPassword({email:email.value,password:password.value});msg.textContent=error?error.message:'';if(!error)show()}
async function logout(){await db.auth.signOut();location.reload()}
async function show(){let {data:{user}}=await db.auth.getUser();if(!user)return;login.classList.add('hidden');dash.classList.remove('hidden');load()}
async function load(){let {data}=await db.from('products').select('*').order('created_at',{ascending:false});list.innerHTML=(data||[]).map(p=>`<div class="product"><span><b>${p.name}</b><br>${p.category} · ₦${Number(p.price).toLocaleString()}</span><button class="danger" onclick="del('${p.id}')">Delete</button></div>`).join('')||'<p>No products yet.</p>'}
async function addProduct(){let file=photo.files[0];if(!name.value||!price.value)return alert('Enter name and price.');let url=null;if(file){let path=crypto.randomUUID()+'-'+file.name;let r=await db.storage.from('products').upload(path,file);if(r.error)return alert(r.error.message);url=db.storage.from('products').getPublicUrl(path).data.publicUrl}let r=await db.from('products').insert({name:name.value,category:category.value,price:Number(price.value),image_url:url,active:true});if(r.error)return alert(r.error.message);name.value='';price.value='';photo.value='';load()}
async function del(id){if(!confirm('Delete this product?'))return;await db.from('products').delete().eq('id',id);load()}
show();
</script></body></html>
